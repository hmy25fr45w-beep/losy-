<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost in the Darkness</title>
<style>
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#0b0b0f; color:#eee; font-family:system-ui,sans-serif;
  }
  main { text-align:center; max-width:650px; padding:30px; }
  h1 { font-weight:400; letter-spacing:.12em; }
  p { color:#888; }
  button {
    margin-top:20px; padding:10px 22px; border:1px solid #555;
    background:#15151b; color:#eee; border-radius:8px; cursor:pointer;
  }
  #message { margin-top:25px; white-space:pre-wrap; color:#ccc; }
  .hint { font-size:12px; margin-top:35px; color:#555; }
</style>
</head>
<body>
<main>
  <h1>LOST IN THE DARKNESS</h1>
  <p>Somewhere in the dark, there is only one star.</p>
  <button onclick="reveal()">Reveal</button>
  <div id="message"></div>
  <div class="hint">There is more here than what you can see.</div>
</main>

<script>
const encrypted = "122a020b1717010d000003011707012412380d0805731b021514112413642f15070635191617240d0812111b052a0313112a6c241265330805100302142d3814";

function reveal() {
  document.getElementById("message").textContent =
    "Encrypted message found:\n" + encrypted +
    "\n\nKeys: KEY / CAT\nCaesar shift: +3";
}
</script>
</body>
</html>
